name: goingon
description: "멀리 있어도, 함께 달려요 — GoingOn"
publish_to: "none"
version: 0.1.1+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (백엔드 — 서버 직접 안 만들어도 돼요)
  firebase_core: ^3.6.0
  # 앱을 켜지 않아도 친구 요청·러닝 요청을 받기 위한 푸시.
  # 발송은 Cloud Functions(functions/)가 담당
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  # 프로필 사진 원본 보관. users 문서에는 주소(photoUrl)만 넣음 —
  # 친구 목록은 실시간 스트림이라 이미지를 문서에 박으면 매 스냅샷마다 따라옴
  firebase_storage: ^12.3.0

  # GPS 트래킹
  geolocator: ^13.0.1

  # 공유 카드 (이미지 생성 + 공유 시트)
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # 폰트는 google_fonts(런타임 다운로드) 대신 assets/fonts/에 번들함 —
  # 이 앱은 타이포그래피가 정체성이라, 네트워크가 없다고 시스템 기본
  # 폰트로 폴백되면 브랜드가 통째로 무너짐

  # 상태 유지
  shared_preferences: ^2.3.2
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  google_sign_in: ^7.2.0
  wakelock_plus: ^1.5.2
  firebase_crashlytics: ^4.3.10
  permission_handler: ^12.0.3

  # 프로필 사진 — 사진첩에서 고르기(image_picker) + 디스크 캐시(cached_network_image).
  # 앱을 켤 때마다 친구 아바타를 다시 내려받지 않으려면 캐시가 필요함
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  audio_session: ^0.2.4
  flutter_soloud: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/splash/
    # 공명 사운드. 지금 들어 있는 것은 **합성 임시 음원**이고 최종 음원으로
    # 교체할 자리다 — 설계서(docs/sound_ux_v1.md §5)가 말하는 프로토타입
    # 산출물이 이 저장소에 없어 같은 규격(모노 44.1k, 8초 심리스 루프)으로
    # 만들어 넣었다
    - assets/audio/

  # 패밀리 이름은 lib/theme.dart의 _serifFamily/_sansFamily와 일치해야 함
  fonts:
    # 본문 — 가변 폰트 한 파일로 100~900 굵기를 모두 커버
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Variable.ttf
    # 타이틀·숫자 — 프로토타입의 Instrument Serif italic
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic

flutter_native_splash:
  color: "#F0EAE0"
  color_dark: "#F0EAE0"
  ios: true
  android: false
  web: false
  fullscreen: true
